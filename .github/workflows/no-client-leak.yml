name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  no-client-leak:
    name: No client leak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan tracked files for customer names / endpoints / identity GUIDs
        # The real customer names live in a repository secret, never in the
        # repo — the scanner must not become the leak (known_issues.md #47).
        env:
          CLIENT_DENYLIST: ${{ secrets.CLIENT_DENYLIST }}
        run: python Meta-Brain/tools/scan_public_safety.py .
      - name: Ensure no PowerPoint deck is tracked
        run: |
          if git ls-files '*.pptx' '*.ppt' | grep .; then
            echo "::error::Binary decks must not be committed — regenerate them from the script next to them (e.g. 'python generate_pptx.py')."
            exit 1
          fi
          echo "No tracked decks."

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Meta-Brain/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Meta-Brain/requirements.txt
      - name: Run tests
        working-directory: Meta-Brain
        run: python -m pytest tests/ -v --tb=short
