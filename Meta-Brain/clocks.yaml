# Expiry clocks — dates this brain has written down as future facts
#
# Some statements in the brain are true only until a date: a retirement, an
# end-of-support, a preview that becomes GA. Written in the future tense, they
# turn silently false the morning after. Nothing in a markdown file notices.
#
# This registry is the alarm. `Meta-Brain/tests/test_clocks.py` fails when a
# clock is due within `warn_days` or already passed, so the repo gets a heads-up
# window instead of quietly shipping a wrong instruction. After the warning has
# been reviewed and the guidance updated, an evidenced acknowledgement can close
# that warning only until the deadline. The clock fails again on the date itself.
#
# It deliberately does NOT list the files that mention each date — that list
# would rot. The test discovers them live and prints them in the failure.
#
# To add a clock: append an entry. To retire one: remove it *after* the prose it
# guards has been rewritten in the past tense, and the test will confirm the
# date is gone from the repo.

warn_days: 30

clocks:
  - date: 2027-01-31
    aliases: ["January 31, 2027"]
    what: "Microsoft Fabric old ontology experience retires"
    why_it_matters: >
      The old and new ontology experiences share the same Fabric item type but
      use incompatible definition formats. Past this date, JSON EntityTypes /
      DataBindings / Contextualizations guidance is migration history, not an
      executable fallback.
    when_due: >
      Remove the old-experience creation paths, keep only a concise historical
      migration note, and verify every scenario and agent uses the TMDL-based
      ontology definition and source-native Data Agent execution.

  - date: 2026-12-01
    aliases: ["December 1, 2026"]
    what: "Microsoft Foundry portal workflow designer and execution retire"
    why_it_matters: >
      Foundry-Brain includes lab examples built on the portal designer and
      execution surface. After this date those examples must not direct readers
      to an unsupported surface; Agent Framework and hosted orchestration remain.
    when_due: >
      Verify the current Microsoft guidance, update the portal-specific prose
      and examples for the post-retirement state, and reassess this clock.
    warning_acknowledged:
      date: 2026-11-04
      reason: >
        Reviewed Microsoft's migration guidance and corrected the affected
        Foundry guidance; the post-retirement review remains due on the date.
      evidence: Foundry-Brain/generation_map.md

  - date: 2027-03-31
    aliases: ["March 31, 2027"]
    what: "Foundry classic agents (azure/foundry-classic/agents/*) retire"
    why_it_matters: >
      generation_map.md exists because two generations ship side by side. Past
      this date there is only one, and every "classic vs current" caveat becomes
      noise that makes the brain harder to read, not safer.
    when_due: >
      Collapse generation_map.md to a short historical note, drop the classic
      branches from the Foundry agent instructions, and remove this clock.
